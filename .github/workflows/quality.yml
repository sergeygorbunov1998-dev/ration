name: Verify Ration+
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check worker/index.js
          node --check worker/telegram-bot.mjs
          node --check worker/telegram-bridge.mjs
          node --check exercise-guides.js
          node --check food-library.js
      - name: Worker API smoke test
        run: node tests/test_worker.mjs
      - name: Offline UI, diet and training regression checks
        run: node tests/test_frontend.mjs
      - name: Simulated iPhone UI interaction tests
        run: |
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26
          node tests/test_dom.mjs
      - name: Telegram approval, privacy and publishing tests
        run: node tests/test_telegram_bridge.mjs
      - name: Telegram intake and publication regression checks
        run: node tests/test_telegram.mjs
